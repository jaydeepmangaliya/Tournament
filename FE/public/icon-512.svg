<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id='bgGrad' cx='50%' cy='40%' r='65%'>
      <stop offset='0%' stop-color='#0f172a' />
      <stop offset='60%' stop-color='#070b14' />
      <stop offset='100%' stop-color='#020408' />
    </radialGradient>

    <!-- Chrome Rim Gradient -->
    <linearGradient id='crestRim' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8' />
      <stop offset='30%' stop-color='#ffffff' />
      <stop offset='65%' stop-color='#94a3b8' />
      <stop offset='100%' stop-color='#0284c7' />
    </linearGradient>

    <!-- Shield Obsidian Body Gradient -->
    <linearGradient id='crestBg' x1='50%' y1='0%' x2='50%' y2='100%'>
      <stop offset='0%' stop-color='#0d1527' />
      <stop offset='100%' stop-color='#030712' />
    </linearGradient>

    <!-- Electric Cyan Neon Gradient -->
    <linearGradient id='cyanCore' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8' />
      <stop offset='40%' stop-color='#22d3ee' />
      <stop offset='100%' stop-color='#0891b2' />
    </linearGradient>

    <!-- Silver Chrome Monogram Gradient -->
    <linearGradient id='crestSilver' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff' />
      <stop offset='60%' stop-color='#e2e8f0' />
      <stop offset='100%' stop-color='#94a3b8' />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id='neonGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>

  <!-- Canvas App Background with Safe Margin (Maskable friendly) -->
  <rect width='512' height='512' rx='110' fill='url(#bgGrad)' />

  <!-- Ambient Outer Cyan Glow -->
  <path d='M256 52 L430 130 V300 C430 395 256 465 256 465 C256 465 82 395 82 300 V130 L256 52 Z'
        fill='none' stroke='#06b6d4' stroke-width='16' opacity='0.3' filter='url(#neonGlow)' />

  <!-- Main Shield Body -->
  <path d='M256 60 L420 134 V296 C420 388 256 454 256 454 C256 454 92 388 92 296 V134 L256 60 Z'
        fill='url(#crestBg)' stroke='url(#crestRim)' stroke-width='14' stroke-linejoin='round' />

  <!-- Inner Subtle Glass Top Highlight -->
  <path d='M256 78 L396 142 V210 L256 150 L116 210 V142 L256 78 Z'
        fill='#ffffff' fill-opacity='0.05' />

  <!-- === THE 'LE' ESPORTS MONOGRAM === -->
  <!-- 'L' Monogram in Silver Chrome -->
  <path d='M160 160 H215 V315 H335 L308 358 H160 V160 Z'
        fill='url(#crestSilver)' filter='drop-shadow(0 4px 12px rgba(0,0,0,0.8))' />

  <!-- 'E' Top Aerodynamic Wing in Electric Cyan -->
  <path d='M240 160 H352 L320 205 H240 V160 Z'
        fill='url(#cyanCore)' filter='url(#neonGlow)' />

  <!-- 'E' Middle Aerodynamic Wing in Electric Cyan -->
  <path d='M240 236 H326 L298 280 H240 V236 Z'
        fill='url(#cyanCore)' filter='url(#neonGlow)' />

  <!-- Cybernetic Accent Notch on Shield Base -->
  <polygon points='256,410 244,430 268,430' fill='#22d3ee' opacity='0.8' />
</svg>